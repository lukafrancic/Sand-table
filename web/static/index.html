<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Select Item</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="container">
    <div class="main-layout">
      <div class="left-panel">
    
        <h1>Select an Item</h1>
        <div id="items" class="grid"></div>
        <div id="params"></div>

        <button onclick="sendData()">Send</button>

        <div>
          <label>Set speed</label>
        </div>
        <div>
          <input type="range" id="speed-slider" min="0" max="100" step="5"/>
          <p>Value: <output id="speed-value"></output>%</p>
        </div>
        
        <div class="color-selector">
          <div>
            <label>Set color</label>
          </div>
          <input type="range" id="R-slider" min="0" max="255" step="5"/>
          <p>Value: <output id="R-value"></output>%</p>
          <input type="range" id="G-slider" min="0" max="255" step="5"/>
          <p>Value: <output id="G-value"></output>%</p>
          <input type="range" id="B-slider" min="0" max="255" step="5"/>
          <p>Value: <output id="B-value"></output>%</p>
          <button onclick="updateColor()">Update</button>
        </div>
      </div>
  
      <div class="right-panel">
        <button onclick="home()">Home</button>
        <button onclick="start()">Start</button>
        <button onclick="stop()">Stop</button>
        <button onclick="clearQueue()">Clear</button>
      </div>
    </div>

  </div>
  <script src="/static/script.js"></script>
</body>
</html>
